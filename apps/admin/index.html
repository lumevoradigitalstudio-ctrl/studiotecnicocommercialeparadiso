<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RITMO — Admin</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:24px;background:#FAF7F2;color:#1F2A24}input,button,select{font:inherit;min-height:44px;margin:4px 0;padding:0 12px;border-radius:12px;border:1px solid #E6E0D6}button{background:#2F6B57;color:#fff;border:0;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px}td,th{padding:8px 12px;border-bottom:1px solid #E6E0D6;text-align:left}.err{color:#8A1C1C}.muted{color:#55625A;font-size:.9em}</style></head>
<body>
<h1>RITMO — Dashboard</h1>
<p class="muted">Solo dati aggregati. Nessuna conversazione né dato sanitario individuale. Ogni accesso viene registrato.</p>
<form id="login"><label>Email<br><input id="email" type="email" autocomplete="username" required></label><br><label>Password<br><input id="pw" type="password" autocomplete="current-password" required></label><br><button type="submit">Accedi</button></form>
<div id="out" hidden>
 <label>Periodo <select id="days"><option value="7">7 giorni</option><option value="30" selected>30 giorni</option><option value="90">90 giorni</option></select></label> <button id="reload" type="button">Aggiorna</button> <button id="logout" type="button">Esci</button>
 <table id="tbl" aria-label="Metriche"></table>
 <p class="muted" id="note"></p>
</div>
<p id="err" class="err" role="alert"></p>
<script src="config.js"></script>
<script src="admin.js"></script></body></html>
